<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>投注记录</title>
<style>
:root{--bg:#f6f5f1;--fg:#22232a;--mut:#76756e;--rule:#cbc7bc;--acc:#2d5a4a;--err:#a33528}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141519;--fg:#e7e6e1;
--mut:#8f8d86;--rule:#3b3d44;--acc:#7fb9a1;--err:#e0887c}}
:root[data-theme=dark]{--bg:#141519;--fg:#e7e6e1;--mut:#8f8d86;--rule:#3b3d44;
--acc:#7fb9a1;--err:#e0887c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);
font:16px/1.6 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#gate{max-width:420px;margin:0 auto;padding:16vh 20px 40px}
h1{font-size:19px;margin:0 0 6px;font-weight:600}
p{margin:0 0 18px;color:var(--mut);font-size:14px}
form{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;padding:10px 12px;border-radius:7px;
border:1px solid var(--rule);background:var(--bg);color:var(--fg)}
input:focus{outline:2px solid var(--acc);outline-offset:1px}
button{font:inherit;padding:10px 18px;border-radius:7px;border:0;
background:var(--acc);color:#fff;cursor:pointer;font-weight:500}
button:disabled{opacity:.55;cursor:default}
#msg{margin-top:14px;font-size:14px;min-height:1.6em}
#msg.err{color:var(--err)}#msg.ok{color:var(--acc)}
#diag{margin-top:26px;padding-top:14px;border-top:1px solid var(--rule);
font-size:12.5px;color:var(--mut);line-height:1.7}
#diag b{color:var(--fg);font-weight:600}
code{font-family:ui-monospace,Menlo,monospace;font-size:12px}
</style></head><body>
<div id="gate">

    <input id="pw" type="password" placeholder="口令" autofocus
           autocomplete="current-password" enterkeyhint="go">
    <button id="go" type="submit">打开</button>
  </form>
  <div id="msg"></div>
  <div id="diag">检查运行环境…</div>
</div>

  var $ = function (id) { return document.getElementById(id); };
  var msg = $("msg"), diag = $("diag"), go = $("go");

  function say(t, cls) { msg.textContent = t; msg.className = cls || ""; }

  // Environment first, in words, before anything can fail silently.
  var secure = window.isSecureContext;
  var hasCrypto = !!(window.crypto && window.crypto.subtle && window.crypto.subtle.importKey);
  diag.innerHTML =
    "<b>运行环境</b><br>" +
    "安全上下文(HTTPS):" + (secure ? "是" : "<b>否</b>") + "<br>" +
    "浏览器加密接口:" + (hasCrypto ? "可用" : "<b>不可用</b>") + "<br>" +
    "密文长度:" + D.ct.length + " 字符";

  if (!hasCrypto) {
    go.disabled = true;
    say(secure
      ? "这个浏览器没有 Web Crypto 接口,无法解密。请换用较新的 Chrome、Edge、Safari 或 Firefox。"
      : "页面不在 HTTPS 下打开,浏览器因此禁用了加密接口。请用 https:// 开头的网址访问。", "err");
    return;
  }

  function b64(s) {
    var raw = atob(s), a = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) a[i] = raw.charCodeAt(i);
    return a;
  }
  function hex(s) {
    var a = new Uint8Array(s.length / 2);
    for (var i = 0; i < a.length; i++) a[i] = parseInt(s.substr(i * 2, 2), 16);
    return a;
  }

  async function open_(pass) {
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2",
                                             false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: hex(D.salt), iterations: D.iters, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(D.iv) },
                                            key, b64(D.ct));
    return new TextDecoder().decode(plain);
  }

  $("f").addEventListener("submit", async function (e) {
    e.preventDefault();
    var pass = $("pw").value;
    if (!pass) { say("请输入口令。", "err"); return; }
    go.disabled = true;
    say("正在解密,约需一两秒…", "ok");
    var html;
    try {
      html = await open_(pass);
    } catch (err) {
      go.disabled = false;
      say("口令不正确。", "err");
      $("pw").select();
      return;
    }
    try {
      document.open(); document.write(html); document.close();
    } catch (err2) {
      go.disabled = false;
      say("解密成功但页面渲染失败:" + err2.message, "err");
    }
  });
  say("");
})();
